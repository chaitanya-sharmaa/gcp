# 1. Kubernetes Service Account with Workload Identity Annotation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: default
  annotations:
    # Google Service Account created by Terraform modules/secrets
    iam.gke.io/gcp-service-account: "gke-secrets-sa@project-ddfa7a80-7677-4268-95a.iam.gserviceaccount.com"
---
# 2. SecretProviderClass: Maps Google Secret Manager secret to Pod filesystem
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-secret-provider
  namespace: default
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/project-ddfa7a80-7677-4268-95a/secrets/db-password/versions/latest"
        fileName: "db_password.txt"
---
# 3. ConfigMap: Simulates our Backend App Data
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-data
data:
  data.json: |
    {
      "status": "success",
      "message": "Hello from the secure GKE Backend via Istio!",
      "database_status": "Connected to Cloud SQL via Private IP (Simulated)",
      "secret_manager_status": "Secret db-password mounted securely at /etc/secrets/db_password.txt via Workload Identity",
      "records": [
        {"id": 1, "name": "Chaitanya's Test Record"},
        {"id": 2, "name": "Istio End-to-End Encryption works!"}
      ]
    }
  default.conf: |
    server {
      listen 80;
      location / {
        return 200 'Healthy';
        add_header Content-Type text/plain;
      }
      location /api/data {
        alias /usr/share/nginx/html/data.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
      }
    }
---
# 4. Deployment: The actual containers running our backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data-volume
          mountPath: /usr/share/nginx/html/data.json
          subPath: data.json
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        # Mount the Secret Manager secret directly from RAM via CSI Driver:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
      volumes:
      - name: data-volume
        configMap:
          name: backend-data
      - name: config-volume
        configMap:
          name: backend-data
      # CSI Volume referencing the SecretProviderClass
      - name: secret-volume
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-secret-provider"
---
# 3. Service: The internal IP address inside the cluster (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  # Note: The BackendConfig annotation is now on the istio-ingressgateway!
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
  - port: 80
    targetPort: 80
---
# 4. BackendConfig (In istio-system to attach WAF to the istio-ingressgateway)
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-waf-config
  namespace: istio-system
spec:
  securityPolicy:
    name: "backend-standard-policy"
---
# 5. GKE Ingress (The GCLB, deployed in istio-system to route to the gateway)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: istio-system
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  tls:
  - secretName: backend-tls
  defaultBackend:
    service:
      name: istio-ingressgateway
      port:
        number: 443
---
# 6. Istio Gateway (Terminates the re-encrypted SSL from GCLB)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: backend-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: backend-tls # Secret must be in istio-system
    hosts:
    - "*"
---
# 7. Istio VirtualService (Routes from Gateway to the backend-service)
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend-vs
  namespace: default
spec:
  hosts:
  - "*"
  gateways:
  - backend-gateway
  http:
  - route:
    - destination:
        host: backend-service
        port:
          number: 80
