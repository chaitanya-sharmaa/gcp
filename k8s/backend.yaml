# 1. ConfigMap: Simulates our Backend App Data and enables CORS
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-data
data:
  data.json: |
    {
      "status": "success",
      "message": "Hello from the secure GKE Backend!",
      "database_status": "Connected to Cloud SQL via Private IP (Simulated)",
      "records": [
        {"id": 1, "name": "Chaitanya's Test Record"},
        {"id": 2, "name": "GKE Rocks!"}
      ]
    }
  default.conf: |
    server {
      listen 80;
      
      # GCP Load Balancer Health Check requires a 200 OK response at the root path '/'
      location / {
        return 200 'Healthy';
        add_header Content-Type text/plain;
      }

      location /api/data {
        alias /usr/share/nginx/html/data.json;
        default_type application/json;
        # CRITICAL for Frontend: This allows the browser to accept the data
        add_header Access-Control-Allow-Origin *;
      }
    }
---
# 2. Deployment: The actual containers running our backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: api
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data-volume
          mountPath: /usr/share/nginx/html/data.json
          subPath: data.json
        - name: config-volume
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
      volumes:
      - name: data-volume
        configMap:
          name: backend-data
      - name: config-volume
        configMap:
          name: backend-data
---
# 3. Service: The internal IP address inside the cluster (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
  - port: 80
    targetPort: 80
---
# 4. Ingress: The Google Cloud Load Balancer!
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  tls:
  - secretName: backend-tls
  defaultBackend:
    service:
      name: backend-service
      port:
        number: 80
